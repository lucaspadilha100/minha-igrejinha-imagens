name: Fotos pelas categorias do Commons

on:
  push:
    branches: [main]
    paths: ['.ferramentas/alvos.json']

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .ferramentas
      - run: pip install --quiet pillow
      - run: python3 .ferramentas/categorias.py .ferramentas/alvos.json saida
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fotos-categorias
          path: saida
          retention-days: 30
